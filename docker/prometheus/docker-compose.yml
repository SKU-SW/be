version: '3.8'

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d' # 데이터 보관 주기
    restart: always
    networks:
      - sw_monitor


  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    user: "0" # 권한 문제 방지 (root 계정 권한으로 실행)
    volumes:
      - grafana_data:/var/lib/grafana
    restart: always
    ports:
      - "3000:3000" # ALB가 바라보는 포트
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin # 초기 비밀번호 (접속 후 변경 권장)
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_RENDERING_SERVER_URL=http://renderer:8081/render
      - GF_RENDERING_CALLBACK_URL=http://grafana:3000/
      - GF_RENDERING_RENDERER_TOKEN=my-render-token
    networks:
      - sw_monitor
    depends_on:
      - renderer


  renderer:
    image: grafana/grafana-image-renderer:latest
    container_name: grafana-renderer

    environment:
      AUTH_TOKEN: my-render-token
    networks:
      - sw_monitor

volumes:
  prometheus_data: {}
  grafana_data: {}

networks:
  sw_monitor: {}